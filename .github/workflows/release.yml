name: Release

# Pushing a tag such as v0.7.0 builds the binaries (see .goreleaser.yaml),
# publishes them as a GitHub release with checksums, and attests where they
# came from.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release
  id-token: write # sign the attestation
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the changelog is made from the history
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # a release is only cut from code that passes
      - run: go test ./... -count=1

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/attest-build-provenance@v2
        with:
          subject-checksums: dist/checksums.txt
