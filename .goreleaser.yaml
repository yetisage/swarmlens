# Release builds, run by .github/workflows/release.yml when a v* tag is pushed.
# Try it without publishing anything:
#
#   goreleaser release --snapshot --clean --skip=publish
version: 2

project_name: swarmlens

before:
  hooks:
    - go mod tidy -diff
    # the notices of everything linked into the binary travel with it
    - sh scripts/third-party-licenses.sh THIRD_PARTY_LICENSES.txt

builds:
  - id: swarmlens
    main: .
    binary: swarmlens
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos: [linux, darwin, windows, freebsd]
    goarch: [amd64, arm64, arm, "386"]
    goarm: ["7"]
    ignore:
      - { goos: darwin, goarch: arm }
      - { goos: darwin, goarch: "386" }
      - { goos: windows, goarch: arm }
      - { goos: windows, goarch: "386" }
      - { goos: freebsd, goarch: arm }
      - { goos: freebsd, goarch: arm64 }
      - { goos: freebsd, goarch: "386" }

archives:
  - id: swarmlens
    formats: [tar.gz]
    format_overrides:
      - { goos: windows, formats: [zip] }
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}"
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md
      - THIRD_PARTY_LICENSES.txt

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^test"
      - "^ci"
      - "^docs"
      - "^chore"

release:
  prerelease: auto
